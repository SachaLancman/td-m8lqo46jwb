<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Floor</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--pf:'Press Start 2P',ui-monospace,monospace}
html,body{margin:0;height:100%;background:#0b0a1a;color:#f4f0e0;font-family:var(--pf);overflow:hidden}
#hud{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:22px;padding:0 18px;background:#1a1638;border-bottom:4px solid #000;box-shadow:inset 0 -4px 0 #3b3470;z-index:5;font-size:11px}
#hud .t{font-size:13px;color:#ffd23f;text-shadow:2px 2px 0 #000;white-space:nowrap}
.stat{display:flex;flex-direction:column;gap:6px;white-space:nowrap}.stat b{font-weight:normal;color:#9d97c9;font-size:8px}
.up{color:#5dff7a}.dn{color:#ff5d73}
#goalwrap{flex:1;min-width:180px}#goalbar{height:14px;background:#000;border:3px solid #f4f0e0;position:relative;margin-top:6px}
#goalfill{height:100%;width:0;background:repeating-linear-gradient(90deg,#5dff7a 0 8px,#2fc24c 8px 10px);transition:width .8s steps(12)}
#goalpct{position:absolute;right:4px;top:1px;font-size:8px;color:#fff;text-shadow:1px 1px 0 #000}
.badge{padding:5px 8px;border:3px solid #000;font-size:9px;white-space:nowrap}
#demo{display:none;background:#ff3fa4;color:#fff;animation:blink 1s steps(2) infinite;box-shadow:3px 3px 0 #000}
#mode{background:#3fb6ff;color:#000}
@keyframes blink{50%{opacity:.35}}
#hud a{color:#9d97c9;font-size:8px;text-decoration:none}#hud a:hover{color:#ffd23f}
#clock{font-size:9px;color:#9d97c9;white-space:nowrap}
canvas{position:fixed;top:68px;left:0;image-rendering:pixelated}
#ticker{position:fixed;bottom:0;left:0;right:0;height:38px;background:#000;border-top:4px solid #ffd23f;overflow:hidden;z-index:5;display:flex;align-items:center}
#tlabel{background:#ffd23f;color:#000;height:100%;display:flex;align-items:center;padding:0 12px;font-size:10px;z-index:2;flex:none}
#tape{white-space:nowrap;font-size:11px;display:inline-block;animation:scroll 45s linear infinite}
#tape>span{margin-right:48px;margin-left:24px}@keyframes scroll{to{transform:translateX(-50%)}}
#err{position:fixed;top:76px;right:12px;background:#ff5d73;color:#000;font-size:8px;padding:6px;border:3px solid #000;display:none;z-index:6;max-width:360px}
@media (max-width:700px){#hud{height:auto;flex-wrap:wrap;gap:8px 14px;padding:8px 10px;font-size:9px}#hud .t{font-size:10px}
 #goalwrap{flex-basis:100%;order:9;min-width:0}.badge{padding:3px 5px;font-size:7px}#tape{font-size:9px}#tlabel{font-size:8px}}
</style></head><body>
<div id="hud">
 <div class="t">▶ TRADING FLOOR</div>
 <div class="stat"><b>ACCOUNT</b><span id="hv">—</span></div>
 <div class="stat"><b>RETURN</b><span id="hr">—</span></div>
 <div class="stat"><b>CASH</b><span id="hc">—</span></div>
 <div id="goalwrap"><b style="font-weight:normal;color:#9d97c9;font-size:8px">QUEST: REACH <span id="hg">$100,000</span></b><div id="goalbar"><div id="goalfill"></div><span id="goalpct">0%</span></div></div>
 <span class="badge" id="mode">PAPER</span><span class="badge" id="demo">DEMO DATA</span><span class="badge" id="stale" style="display:none;background:#ff9f1c;color:#000">STALE · BOX ASLEEP</span>
 <div class="stat"><span id="clock">—</span><span id="asof" style="font-size:7px;color:#9d97c9">DATA —</span><a id="back" href="#">◀ DASHBOARD</a></div>
</div>
<div id="err"></div>
<canvas id="c"></canvas>
<div id="ticker"><div id="tlabel">TICKER</div><div style="overflow:hidden;flex:1"><div id="tape">Loading…</div></div></div>
<script>
const Q=new URLSearchParams(location.search),DEMO=Q.get('demo')==='1';
const $=id=>document.getElementById(id);
$('back').href='index.html';
const usd=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('en-US',{style:'currency',currency:'USD'});
const pct=v=>v==null||isNaN(v)?'—':(v>=0?'+':'')+(v*100).toFixed(2)+'%';

const TEAM=[
 {id:'technical',name:'Technical Analyst',short:'Technical',shirt:'#3fb6ff',hair:'#2b1a0e',skin:'#f1c27d'},
 {id:'fundamentals',name:'Fundamentals Analyst',short:'Fundamentals',shirt:'#5dff7a',hair:'#d9a441',skin:'#e0ac69'},
 {id:'sentiment',name:'Sentiment Analyst',short:'Sentiment',shirt:'#ff9f1c',hair:'#111',skin:'#8d5524'},
 {id:'risk',name:'Risk Manager',short:'Risk',shirt:'#ff5d73',hair:'#7a7a7a',skin:'#ffdbac'},
 {id:'flow_gamma',name:'Options Flow & Gamma Analyst',short:'Flow & Gamma',shirt:'#2ee6d6',hair:'#3b1f5e',skin:'#d9a066'},
 {id:'skeptic',name:'Skeptic',short:'Skeptic',shirt:'#9aa3b2',hair:'#1c1c1c',skin:'#eac086'},
 {id:'coordinator',name:'Grok Bot',short:'Grok Bot',role:'coordinator',shirt:'#b26bff',hair:null,skin:'#c9d1e0',bot:true},
 {id:'decider',name:'Decider',short:'Decider',shirt:'#ffd23f',hair:'#5a2d0c',skin:'#c68642'},
];
// seating (8 desks): a centered head table (Grok Bot + Decider) and two rows of 3 below it.
// Every row is centered on the floor with the SAME horizontal pitch (W/COLS), and rows are evenly spaced vertically,
// so the 2-desk head row sits in the gaps of the 3-desk rows (brick pattern, mirror-symmetric).
const SEATS={head:['coordinator','decider'],rows:[['technical','fundamentals','sentiment'],['flow_gamma','skeptic','risk']]};
const ALLROWS=[SEATS.head,...SEATS.rows],COLS=Math.max(...ALLROWS.map(r=>r.length));
const DEFAULT_NOTE={idle:'zzz...',sleeping:'zzz...',researching:'Digging into data...',writing:'Writing report...',done:'Report filed!',deciding:'Weighing the calls...',coordinating:'Keeping everyone on track'};
const ICON={idle:'💤',sleeping:'💤',researching:'🔍',writing:'📝',done:'✅',deciding:'🤔',coordinating:'📋'};

let state={roles:{},trades:[]};
const DEMO_DATA={mode:'paper',account_value:10427.35,starting_cash:10000,total_return:.0427,cash:6120.10,goal_target:100000,goal_progress:427.35/90000,
 server_time:'DEMO',roles:{
  coordinator:{state:'coordinating',note:'Sample: kicking off today\'s research cycle'},
  technical:{state:'researching',note:'Sample: checking the XYZ daily chart'},
  fundamentals:{state:'writing',note:'Sample: drafting fundamentals.md'},
  sentiment:{state:'done',note:'Sample: sentiment.md filed'},
  risk:{state:'idle',note:null},
  flow_gamma:{state:'researching',note:'Sample: reading the GEX heatmap'},
  skeptic:{state:'writing',note:'Sample: strongest case against the XYZ call spread'},
  decider:{state:'deciding',note:'Sample: buy, hold, or wait?'}},
 trades:[{time:'DEMO 09:41',action:'BUY',symbol:'FAKE',qty:10,price:123.45},{time:'DEMO 10:15',action:'SELL',symbol:'TEST',qty:5,price:67.80}]};

function applyData(d){
 state=d;
 $('hv').textContent=usd(d.account_value);
 $('hr').textContent=pct(d.total_return);$('hr').className=d.total_return>0?'up':d.total_return<0?'dn':'';
 $('hc').textContent=usd(d.cash);$('hg').textContent=usd(d.goal_target).replace('.00','');
 const g=Math.max(0,Math.min(1,d.goal_progress||0));$('goalfill').style.width=(g*100)+'%';$('goalpct').textContent=(g*100).toFixed(2)+'%';
 $('mode').textContent=String(d.mode||'?').toUpperCase();
 const items=[`<span>ACCOUNT ${usd(d.account_value)} <span class="${d.total_return>=0?'up':'dn'}">${pct(d.total_return)}</span></span>`];
 (d.trades||[]).slice().reverse().slice(0,15).forEach(t=>{const b=/buy/i.test(t.action||'');
  items.push(`<span class="${b?'up':/sell/i.test(t.action||'')?'dn':''}">${b?'▲':'▼'} ${esc(t.action)} ${esc(t.qty)} ${esc(t.symbol)} @ ${usd(t.price)} <span style="color:#9d97c9">${esc(t.time)}</span></span>`)});
 if(!(d.trades||[]).length)items.push('<span style="color:#9d97c9">NO TRADES YET — PRESS START</span>');
 items.push(`<span style="color:#9d97c9">GOAL ${usd(d.goal_target)} · ${(g*100).toFixed(2)}% THERE</span>`);
 const html=items.join('')+items.join('');if($('tape').dataset.h!==html){$('tape').innerHTML=html;$('tape').dataset.h=html}
 const e=d.error||d.status_json_error;$('err').style.display=e?'block':'none';$('err').textContent=e||'';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const STALE_MS=30*60*1000;let pubAt=null,haveData=false;
function showAge(){if(DEMO||!pubAt)return;const a=Date.now()-pubAt,m=Math.round(a/60000);
 $('asof').textContent='DATA '+new Date(pubAt).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})+' ET'+(m>=1?' ('+(m<60?m+'M':Math.round(m/60)+'H')+' AGO)':'');
 $('stale').style.display=a>STALE_MS?'inline-block':'none'}
async function load(){
 if(DEMO){applyData(DEMO_DATA);return}
 try{const r=await fetch('office.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();applyData(d);haveData=true;pubAt=d.published_epoch_ms||null;showAge()}
 catch(e){$('err').style.display='block';$('err').textContent=(haveData?'REFRESH FAILED, SHOWING LAST SNAPSHOT: ':'CONNECTION LOST: ')+e.message}
}
setInterval(showAge,15000);
if(DEMO)$('demo').style.display='inline-block';
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York'})+' ET'},1000);
load();setInterval(load,30000);

// ---------- canvas scene ----------
const cv=$('c'),ctx=cv.getContext('2d');let W,H,P;
let NARROW=false,ROWS=3,BL=3,Y0=0,STEP=0;
function resize(){const top=$('hud').offsetHeight+4;cv.style.top=top+'px';W=cv.width=innerWidth;H=cv.height=Math.max(200,innerHeight-top-42);
 NARROW=W<700;ROWS=ALLROWS.length;
 // pick the biggest pixel size P (and bubble line count) at which all rows fit without overlaps
 const need=(p,l)=>{const fs=Math.max(7,p*1.4),above=l*1.6*fs+p*13,below=p*42,pitch=above+below+p*2,y0=p*14+above;
  return {tot:y0+(ROWS-1)*pitch+below,y0,pitch,below}};
 let pick=null;
 for(let p=7;p>=2&&!pick;p-=.5){if(W/COLS<p*(NARROW?34:46))continue;for(const l of [3,2]){const n=need(p,l);if(n.tot<=H){pick={p,l,...n};break}}}
 if(!pick){const n=need(2,2);pick={p:2,l:2,...n}}
 P=pick.p;BL=pick.l;Y0=pick.y0;STEP=Math.max(pick.pitch,(H-pick.y0-pick.below)/(ROWS-1));}
addEventListener('resize',resize);resize();setTimeout(resize,800);
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function floor(t){
 const s=P*8;
 for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s)R(x,y,s,s,((x/s+y/s)&1)?'#2a2550':'#252047');
 // wall
 R(0,0,W,P*14,'#3b3470');R(0,P*14,W,P,'#000');
 for(let i=0;i<4;i++){const wx=W*(i+.5)/4-P*18;R(wx,P*2,P*36,P*9,'#000');R(wx+P,P*3,P*34,P*7,'#0f2a1a');
  // wall screens: scrolling chart
  ctx.strokeStyle=i%2?'#5dff7a':'#3fb6ff';ctx.lineWidth=P/2;ctx.beginPath();
  for(let k=0;k<=34;k+=2){const yy=P*6.5+Math.sin((k+t/300+i*7)/3)*P*2+Math.sin((k*1.7+t/500))*P;k?ctx.lineTo(wx+P+k*P,yy):ctx.moveTo(wx+P,yy)}ctx.stroke()}
 // plants
 const edge=W/2-(COLS-1)/2*(W/COLS)-P*17;
 ([[P*4,P*18],[W-P*12,P*18]].concat(edge>P*14?[[P*4,H-P*20],[W-P*12,H-P*20]]:[])).forEach(([x,y])=>{R(x+P*2,y+P*8,P*4,P*5,'#8b4a2b');R(x,y+P*2,P*8,P*6,'#2fc24c');R(x+P*2,y,P*4,P*3,'#5dff7a')});
}
// 8x10 sprite: h hair, s skin, e eye, c shirt, d shirt-dark, a arm(skin)
const SPR=['..hhhh..','.hhhhhh.','.hsssssh','.sesses.','.ssssss.','..ssss..','.cccccc.','ccdccdcc','cccccccc','acccccca'];
const BOT=['...dd...','.cccccc.','.cssssc.','.seesee.','.ssssss.','..cddc..','.cccccc.','ccdccdcc','cccccccc','dccccccd'];
function drawChar(m,x,y,st,t,ph){
 const sleep=st==='idle'||st==='sleeping',busy=st==='writing'||st==='researching'||st==='coordinating';
 let bob=sleep?Math.sin(t/900+ph)*P*.5:st==='done'?-Math.abs(Math.sin(t/250+ph))*P*3:Math.sin(t/400+ph)*P;
 const sp=m.bot?BOT:SPR,cw=8*P*1.25,ox=x-cw/2,oy=y+bob+(sleep?P*3:0);
 const col={h:m.hair||'#888',s:m.skin,c:m.shirt,d:shade(m.shirt),a:m.skin};
 const look=st==='researching'?Math.round(Math.sin(t/300)):0, blink=(Math.floor(t/100+ph*30)%40)===0;
 sp.forEach((row,r)=>[...row].forEach((ch,c)=>{
  if(ch==='.')return;let k=ch;
  if(ch==='e'){if(sleep||blink){R(ox+c*P*1.25,oy+r*P*1.25+P*.6,P*1.25,P*.5,'#000');return}
   R(ox+c*P*1.25,oy+r*P*1.25,P*1.25,P*1.25,'#fff');R(ox+(c+(look>0?.4:look<0?0:.2))*P*1.25,oy+r*P*1.25,P*.8,P*1.25,'#000');return}
  if(ch==='h'&&!m.hair)return;
  R(ox+c*P*1.25,oy+r*P*1.25,P*1.25,P*1.25,col[k]||'#f0f')}));
 if(m.bot){R(x-P*.5,oy-P*3,P,P*3,'#999');R(x-P*1.2,oy-P*4.5,P*2.4,P*2,(Math.floor(t/500)%2)?'#ff3fa4':'#5dff7a')}
 return {oy,cw,busy,sleep};
}
function shade(h){const n=parseInt(h.slice(1),16);const f=v=>Math.max(0,(v*.65)|0);return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`}
function drawDesk(m,x,y,st,t,ph){
 const dw=P*34,dh=P*12,dx=x-dw/2,dy=y+P*12;
 // chair
 R(x-P*7,y+P*2,P*14,P*12,'#14112b');
 const c=drawChar(m,x,y-P*2,st,t,ph);
 // desk
 R(dx,dy,dw,dh,'#8b5a2b');R(dx,dy,dw,P*2,'#b07a3f');R(dx,dy+dh,dw,P*2,'#5a3a1b');R(dx+P,dy+dh+P*2,P*2,P*4,'#5a3a1b');R(dx+dw-P*3,dy+dh+P*2,P*2,P*4,'#5a3a1b');
 // monitor (side, screen visible to us)
 const mx=dx+dw-P*13,my=dy-P*8;R(mx,my,P*12,P*9,'#000');R(mx+P,my+P,P*10,P*6,'#0f1f33');R(mx+P*5,my+P*9,P*2,P*2,'#000');
 if(st==='writing'){const n=Math.floor(t/150)%24;for(let l=0;l<5;l++){const w=Math.min(8,Math.max(0,n-l*4));if(w>0)R(mx+P*2,my+P*1.6+l*P*1.1,w*P,P*.6,'#cfe3ff')}}
 else if(st==='researching'||st==='coordinating'){ctx.strokeStyle='#5dff7a';ctx.lineWidth=Math.max(1,P/3);ctx.beginPath();for(let k=0;k<=10;k++){const yy=my+P*4+Math.sin(k*.9+t/250)*P*1.5;k?ctx.lineTo(mx+P+k*P,yy):ctx.moveTo(mx+P,yy)}ctx.stroke()}
 else if(st==='done'){R(mx+P*3,my+P*4,P,P,'#5dff7a');R(mx+P*4,my+P*5,P,P,'#5dff7a');R(mx+P*5,my+P*4,P,P,'#5dff7a');R(mx+P*6,my+P*3,P,P,'#5dff7a');R(mx+P*7,my+P*2,P,P,'#5dff7a')}
 else if(st==='deciding'){const f=Math.floor(t/400)%2;R(mx+P*2,my+P*2,P*3,P*4,f?'#5dff7a':'#2a4a2a');R(mx+P*7,my+P*2,P*3,P*4,f?'#4a2a2a':'#ff5d73')}
 else {R(mx+P*1,my+P*1,P*10,P*6,'#0a0f18')}
 // keyboard + typing hands
 R(x-P*6,dy+P*3,P*12,P*3,'#ddd');for(let k=0;k<5;k++)R(x-P*5+k*P*2.2,dy+P*3.8,P*1.4,P,'#999');
 const typing=st==='writing'||st==='coordinating';const hl=typing&&Math.floor(t/90+ph*10)%2?P:0,hr=typing&&!(Math.floor(t/90+ph*10)%2)?P:0;
 if(!c.sleep){R(x-P*6,dy+P*1-hl,P*3,P*2,m.skin);R(x+P*3,dy+P*1-hr,P*3,P*2,m.skin)}
 // mug & papers
 R(dx+P*3,dy+P*3,P*3,P*4,'#fff');R(dx+P*6,dy+P*4,P,P*2,'#fff');
 if(st==='done'||st==='writing'){R(dx+P*8,dy+P*3,P*5,P*6,'#f4f0e0');R(dx+P*9,dy+P*4,P*3,P*.5,'#888');R(dx+P*9,dy+P*5.5,P*3,P*.5,'#888')}
 // name plate
 ctx.font=`${Math.max(7,P*1.6)}px ${getComputedStyle(document.body).fontFamily}`;ctx.textAlign='center';ctx.textBaseline='middle';
 const label=NARROW?(m.short||m.name):m.name+(m.bot?' (coordinator)':'');const lw=ctx.measureText(label).width+P*4;
 R(x-lw/2,dy+dh+P*7,lw,P*5,'#000');R(x-lw/2+P*.5,dy+dh+P*7.5,lw-P,P*4,'#1a1638');ctx.fillStyle='#ffd23f';ctx.fillText(label,x,dy+dh+P*9.6);
 // status pill
 const stl=(ICON[st]||'❔')+' '+st.toUpperCase();ctx.font=`${Math.max(6,P*1.3)}px ${getComputedStyle(document.body).fontFamily}`;
 const sw=ctx.measureText(stl).width+P*4;R(x-sw/2,dy+dh+P*13.5,sw,P*4,stColor(st));ctx.fillStyle='#000';ctx.fillText(stl,x,dy+dh+P*15.6);
 return c;
}
function stColor(s){return{done:'#5dff7a',writing:'#3fb6ff',researching:'#ffd23f',deciding:'#ff9f1c',coordinating:'#b26bff',idle:'#9d97c9',sleeping:'#9d97c9'}[s]||'#ff5d73'}
function bubble(x,y,text,t,ph,sleep){
 const fam=getComputedStyle(document.body).fontFamily;
 if(sleep){ctx.font=`${P*2}px ${fam}`;ctx.textAlign='left';for(let i=0;i<3;i++){const k=((t/1200+i/3+ph)%1);ctx.globalAlpha=1-k;ctx.fillStyle='#cfe3ff';ctx.font=`${P*(1.4+i*.5)}px ${fam}`;ctx.fillText('Z',x+P*7+k*P*6+i*P*2,y+P*4-k*P*8-i*P*2)}ctx.globalAlpha=1;
  if(!text||text==='zzz...')return}
 const fs=Math.max(7,P*1.4);ctx.font=`${fs}px ${fam}`;const maxw=Math.min(BL<3?P*72:P*44,W/COLS-P*6),words=String(text).split(/\s+/),lines=[];let cur='';
 words.forEach(w=>{const tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>maxw&&cur){lines.push(cur);cur=w}else cur=tt});if(cur)lines.push(cur);
 if(lines.length>BL){lines.splice(BL);lines[BL-1]=(lines[BL-1].replace(/\s*\S*$/,'')||lines[BL-1].slice(0,-1))+'…'}
 const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+P*4,lh=fs*1.6,bh=lines.length*lh+P*3;
 const bx=Math.min(Math.max(P,x-bw/2),W-bw-P),by=y-bh-P*4+Math.sin(t/600+ph)*P*.5;
 R(bx-P*.6,by-P*.6,bw+P*1.2,bh+P*1.2,'#000');R(bx,by,bw,bh,'#fff');
 R(x-P,by+bh,P*2,P*1.5,'#000');R(x-P*.4,by+bh,P*.8,P*1,'#fff');R(x-P*.4,by+bh+P*1.5,P*.8,P*1.5,'#000');
 ctx.fillStyle='#111';ctx.textAlign='left';ctx.textBaseline='top';lines.forEach((l,i)=>ctx.fillText(l,bx+P*2,by+P*1.8+i*lh));ctx.textBaseline='middle';
}
function frame(t){
 ctx.imageSmoothingEnabled=false;floor(t);
 const y0=Y0,step=STEP,gw=W/COLS,pos={};
 // each row centered: desk k of n sits at W/2+(k-(n-1)/2)*gw -> equal gaps everywhere
 ALLROWS.forEach((row,ri)=>row.forEach((id,ci)=>pos[id]=[W/2+(ci-(row.length-1)/2)*gw,y0+step*ri]));
 const extra=TEAM.filter(m=>!pos[m.id]);extra.forEach((m,k)=>pos[m.id]=[gw*(k%COLS+.5),y0+step*(ROWS+Math.floor(k/COLS))]);
 // head-table rug spanning the head row (drawn under the desks)
 const hxs=SEATS.head.map(id=>pos[id][0]),rl=Math.min(...hxs)-P*25,rw=Math.max(...hxs)+P*25-rl;R(rl,y0-P*15,rw,P*54,'#000');R(rl+P,y0-P*14,rw-P*2,P*52,'#4a2340');
