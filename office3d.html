 g.fillStyle='#343c50';g.fillRect(0,0,256,256);g.strokeStyle='#2a3142';g.lineWidth=4;
 for(let i=0;i<=256;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,256);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(256,i);g.stroke()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(W/4,D/4);t.colorSpace=THREE.SRGBColorSpace;return t}

const slab=box(W,0.6,D,[M('#262c3b'),M('#262c3b'),floorMat,M('#262c3b'),M('#20263a'),M('#20263a')],0,-0.3,0,scene,false);slab.receiveShadow=true;

wall(W,1.1,0.3,0,-D/2+0.15,0,-1);wall(0.3,1.1,D,-W/2+0.15,0,-1,0);wall(W,0.7,0.3,0,D/2-0.15,0,1);wall(0.3,0.7,D,W/2-0.15,0,1,0);

box(9.6,4.3,0.25,scrFrameMat,0,3.35,0,screenGrp);

const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();

const drawCheck=g=>{g.fillStyle='#1b1830';g.beginPath();g.arc(64,64,60,0,7);g.fill();g.fillStyle='#3ddc6a';g.beginPath();g.arc(64,64,52,0,7);g.fill();

 g.beginPath();g.moveTo(40,88);g.lineTo(30,114);g.lineTo(62,88);g.fill();g.fillStyle='#1b1830';[42,64,86].forEach(x=>{g.beginPath();g.arc(x,55,8,0,7);g.fill()})};

function makeMonitor(color){const c=document.createElement('canvas');c.width=160;c.height=100;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
 const pts=[];let v=50;for(let i=0;i<32;i++){v+=Math.random()*10-5;v=Math.max(15,Math.min(85,v));pts.push(v)}
 return {c,g:c.getContext('2d'),t,pts,color,next:0}}

 if(st!=='blocked'){let v=m.pts[m.pts.length-1]+(Math.random()*12-5.5);m.pts.push(Math.max(12,Math.min(88,v)));m.pts.shift()}
 g.fillStyle=st==='blocked'?'#2a0b0e':'#0f1424';g.fillRect(0,0,w,h);

 const col=st==='blocked'?'#ff3b30':st==='done'?'#3ddc6a':m.color;
 g.beginPath();m.pts.forEach((p,i)=>{const x=i*(w/(m.pts.length-1)),y=h-p;i?g.lineTo(x,y):g.moveTo(x,y)});
 g.strokeStyle=col;g.lineWidth=4;g.lineJoin='round';g.stroke();
 g.lineTo(w,h);g.lineTo(0,h);g.closePath();g.fillStyle=col+'33';g.fill();

 m.t.needsUpdate=true}

(()=>{const g=new THREE.Group();g.position.set(9.5,0,8.4);scene.add(g);box(0.7,1.1,0.7,M('#e8ecf5'),0,0.55,0,g);cyl(0.3,0.3,0.6,M('#8fd3ff',{transparent:true,opacity:.75}),0,1.4,0,g,10);
 box(2.6,1.6,0.6,M('#8a6a52'),-2.4,0.8,0.6,g);['#ff9fb2','#9bd5ff','#ffd98a','#b5ead7','#c9b6ff','#ffadad'].forEach((c,i)=>box(0.25,0.45,0.4,M(c),-3.3+i*0.34,1.83,0.6,g));})();

 const pants=M('#3b4060'),shirt=M(shade(color,.82)),skin=M(bot?'#c9d1e0':'#f1c9a0'),cap=M(color),dark=M('#1b1830');

function buildPath(d,t){const P=[],add=(x,z)=>P.push(new THREE.Vector3(x,0,z));

let walker=null;
function startWalk(){if(walker)return;const ids=Object.keys(desks).filter(id=>id!=='crazy'&&desks[id].state!=='blocked');if(!ids.length)return;
 const from=desks[ids[Math.floor(Math.random()*ids.length)]];const others=Object.keys(desks).filter(id=>id!==from.T.id);
 const to=desks[Math.random()<.45&&from.T.id!=='decider'?'decider':others[Math.floor(Math.random()*others.length)]];
 const path=buildPath(from,to);const back=path.slice().reverse();
 // reparent to scene for world-space walking
 const ch=from.ch;from.g.remove(ch.root);scene.add(ch.root);ch.root.position.copy(path[0]);
 ch.legs.forEach(l=>l.rotation.x=0);
 walker={d:from,to,legs:[path,back],leg:0,seg:0,s:0,pause:0,talk:null};from.walking=true}
function endWalk(){const d=walker.d,ch=d.ch;scene.remove(ch.root);d.g.add(ch.root);ch.root.position.set(-0.2,0,0.85);ch.root.rotation.y=0;seatPose(ch);ch.arms.forEach(a=>a.rotation.x=0);d.walking=false;walker=null}
const talkSprite=iconSprite(drawTalk,0.6);talkSprite.visible=false;scene.add(talkSprite);
function stepWalk(dt,now){const w=walker,ch=w.d.ch,path=w.legs[w.leg];
 if(w.pause>0){w.pause-=dt;talkSprite.visible=true;talkSprite.position.set(ch.root.position.x,2.15+Math.sin(now*0.006)*0.05,ch.root.position.z);
  ch.legs.forEach(l=>l.rotation.x=0);ch.arms[1].rotation.x=0.4+Math.sin(now*0.01)*0.3;ch.hip.position.y=0.5;
  // face the visited colleague
  const tp=w.to.ch.root.getWorldPosition(new THREE.Vector3());ch.root.rotation.y=Math.atan2(-(tp.x-ch.root.position.x),-(tp.z-ch.root.position.z));
  if(w.pause<=0){talkSprite.visible=false;w.leg=1;w.seg=0;w.s=0}return}
 const a=path[w.seg],b=path[w.seg+1];if(!b){if(w.leg===0){w.pause=2.6;return}endWalk();return}
 const len=a.distanceTo(b)||0.001;w.s+=dt*2.1;const k=Math.min(1,w.s/len);ch.root.position.lerpVectors(a,b,k);
 const dx=b.x-a.x,dz=b.z-a.z;if(len>0.01){const target=Math.atan2(-dx,-dz);let diff=target-ch.root.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));ch.root.rotation.y+=diff*Math.min(1,dt*12)}
 const sw=Math.sin(now*0.012)*0.6;ch.legs[0].rotation.x=sw;ch.legs[1].rotation.x=-sw;ch.arms[0].rotation.x=-sw*.8;ch.arms[1].rotation.x=sw*.8;ch.hip.position.y=0.5+Math.abs(Math.cos(now*0.012))*0.05;
 if(k>=1){w.seg++;w.s=0}}

drawScreen();load();setInterval(load,60000);setInterval(showAge,15000);
document.fonts&&document.fonts.ready.then(()=>drawScreen());

// ---------- tap / click on desks ----------
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
 ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);const h=ray.intersectObjects(clickables,false)[0];
 if(h)toggleLabel(h.object.userData.id);else toggleLabel(null)});

// ---------- resize ----------
function resize(){const w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h);labelR.setSize(w,h);
 const halfW=a<0.8?17:15.5,halfH=Math.max(a<0.8?11:11.2,halfW/a),sh=($('hud').offsetHeight-($('legend').offsetHeight+10))/2/h*2*halfH;
 camera.left=-halfH*a;camera.right=halfH*a;camera.top=halfH+sh;camera.bottom=-halfH+sh;
 camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

// ---------- animate ----------
const clock=new THREE.Clock();let nextMsg=1.5,nextWalk=6,el=0;const cdir=new THREE.Vector3();
function frame(){requestAnimationFrame(frame);if(document.hidden)return;
 const dt=Math.min(clock.getDelta(),0.1);el+=dt;const now=performance.now();
 controls.update(dt);
 // wall fading
 cdir.subVectors(camera.position,controls.target);const cx=cdir.x,cz=cdir.z,cl=Math.hypot(cx,cz)||1;
 walls.forEach(w=>{const front=(w.n.x*cx+w.n.y*cz)/cl>0.25;w.o+=((front?0.12:1)-w.o)*Math.min(1,dt*6);w.objs.forEach(o=>{o.material.opacity=w.o;o.material.depthWrite=w.o>0.9;o.castShadow=w.o>0.5})});
 const sf=walls[0].o;scrFrameMat.opacity=Math.max(sf,0.2);scrMat.opacity=Math.max(sf,0.25);scrGlow.material.opacity=0.22*sf;
 // desks
 Object.values(desks).forEach((d,i)=>{const ch=d.ch,st=d.state,t=now/1000+d.phase;
  if(!d.walking){
   if(st==='working'){ch.hip.position.y=0.5+Math.abs(Math.sin(t*9))*0.01;ch.arms[0].rotation.x=1.15+Math.sin(t*22)*0.14;ch.arms[1].rotation.x=1.15+Math.sin(t*22+Math.PI)*0.14;ch.head.rotation.x=0.12+Math.sin(t*3)*0.03;ch.head.rotation.y=Math.sin(t*1.3)*0.1}
   else if(st==='blocked'){ch.hip.position.y=0.5;ch.arms.forEach(a=>a.rotation.x=0.2);ch.head.rotation.x=0.35;ch.head.rotation.y=Math.sin(t*4)*0.25}
   else{ch.hip.position.y=0.5+Math.sin(t*2)*0.04;ch.arms.forEach(a=>a.rotation.x=st==='done'?0.25:0.1+Math.sin(t*2)*0.05);ch.head.rotation.x=st==='done'?-0.1:0.05;ch.head.rotation.y=Math.sin(t*0.7)*0.18}}
  d.chk.position.y=2.05+Math.sin(t*2.4)*0.08;d.chk.material.rotation=Math.sin(t*1.5)*0.15;
  if(st==='blocked'){d.bang.position.y=2.1+Math.abs(Math.sin(t*5))*0.12;d.rg.material.opacity=0.35+0.45*Math.abs(Math.sin(t*4))}else d.rg.material.opacity=0.5;
  d.mons.forEach(m=>{const glow=st==='working'?0.35+Math.random()*0.25:st==='blocked'?0.3+0.25*Math.abs(Math.sin(t*4)):0;
   m.gl.material.opacity=glow;m.gl.material.color.set(st==='blocked'?'#ff3b30':d.T.c);
   const flick=st==='working'?(Math.random()<0.06?0.75:1):st==='idle'?0.7:1;m.sm.color.setScalar(flick);
   if(now>m.mon.next){drawMonitor(m.mon,st,now);m.mon.next=now+(st==='working'?140:st==='blocked'?1000:1600)}})});
 // crazy fx
 if(crazyFx){const f=crazyFx;const k=0.75+Math.sin(el*6)*0.15+Math.random()*0.1;f.flame.scale.set(1,k*1.2,1);f.flame2.scale.set(1,k,1);f.body.position.y=0.95+Math.sin(el*3)*0.05;
  f.sglow.material.opacity=0.38+Math.sin(el*3.2)*0.12;f.lamp.intensity=5+Math.sin(el*7)*1.2+Math.random()*0.8}
 // messages
 nextMsg-=dt;if(nextMsg<=0){nextMsg=2+Math.random()*2.5;const ids=Object.keys(desks).filter(i=>i!=='decider');
  const r=Math.random();if(r<0.65)sendMsg(ids[Math.floor(Math.random()*ids.length)],'decider');else if(r<0.85)sendMsg('decider','coordinator');else{const o=ids.filter(i=>i!=='coordinator');sendMsg('coordinator',o[Math.floor(Math.random()*o.length)])}}
 for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];m.t+=dt/m.dur;const k=Math.min(1,m.t);m.dot.position.copy(m.curve.getPoint(k));
  m.line.material.opacity=Math.min(0.55,Math.sin(Math.min(1,m.t*0.8)*Math.PI)*0.6);m.dot.scale.setScalar(k>0.95?Math.max(0.01,(1.1-k)*6):1);
  if(m.t>=1.25){scene.remove(m.line);scene.remove(m.dot);m.line.geometry.dispose();msgs.splice(i,1)}}
 // walking
 nextWalk-=dt;if(nextWalk<=0&&!walker){nextWalk=10+Math.random()*10;startWalk()}
 if(walker)stepWalk(dt,now);
 renderer.render(scene,camera);labelR.render(scene,camera)}
frame();
</script></body></html>
